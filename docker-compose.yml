version: "3.9"
services:
  p2pnet-tritonserver:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    command: tritonserver --model-repository=/models
    volumes:
      - ./model_repo:/models   # put your Triton models here
    ports:
      - "8014:8000"   # HTTP
      # - "8001:8001"   # gRPC
      # - "8002:8002"   # Metrics
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  count-api:
    build: .
    depends_on:
      - p2pnet-tritonserver
    ports:
      - "9012:9000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
